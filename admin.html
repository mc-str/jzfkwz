<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>矩阵方块管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 1.5rem; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1.3rem; margin-bottom: 1rem; color: #1f2937; }
        .stats-grid { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1.5rem; border-radius: 1rem; flex: 1; min-width: 150px; text-align: center; }
        .stat-number { font-size: 2rem; font-weight: bold; }
        .stat-label { font-size: 0.85rem; opacity: 0.9; margin-top: 0.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; font-weight: 600; }
        button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 2rem; font-size: 0.85rem; cursor: pointer; transition: 0.2s; margin-right: 0.5rem; }
        button:hover { opacity: 0.85; transform: translateY(-1px); }
        button.danger { background: #ef4444; }
        button.secondary { background: #6b7280; }
        .form-group { margin-bottom: 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
        .form-group label { width: 100px; font-weight: 500; color: #374151; }
        .form-group input, .form-group select, .form-group textarea { flex: 1; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 0.75rem; font-size: 0.9rem; }
        .message { padding: 0.75rem; border-radius: 0.75rem; margin-top: 1rem; display: none; }
        .message.success { background: #d1fae5; color: #065f46; display: block; }
        .message.error { background: #fee2e2; color: #991b1b; display: block; }
        .login-area { text-align: center; }
        .login-area input { padding: 0.6rem 1rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 2rem; width: 250px; margin-right: 0.5rem; }
        .loading { text-align: center; padding: 2rem; color: #6b7280; }
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .form-group { flex-direction: column; align-items: stretch; }
            .form-group label { width: auto; margin-bottom: 0.25rem; }
            .stats-grid { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🔧 矩阵方块管理后台</h1>
        <p>管理产品、查看访问统计（数据与官网完全同步）</p>
    </div>

    <div id="loginSection" class="card login-area">
        <h2>管理员登录</h2>
        <input type="password" id="adminPassword" placeholder="请输入管理密码" autocomplete="off">
        <button id="loginBtn">登录</button>
    </div>

    <div id="adminContent" style="display: none;">
        <div class="card">
            <h2>📊 访问统计（全局统一）</h2>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number" id="totalViews">--</div><div class="stat-label">总预览</div></div>
                <div class="stat-card"><div class="stat-number" id="todayViews">--</div><div class="stat-label">今日</div></div>
                <div class="stat-card"><div class="stat-number" id="yesterdayViews">--</div><div class="stat-label">昨日</div></div>
            </div>
            <button id="refreshStatsBtn" class="secondary">🔄 刷新统计</button>
        </div>

        <div class="card">
            <h2>📦 产品管理</h2>
            <button id="refreshProductsBtn" class="secondary" style="margin-bottom: 1rem;">🔄 刷新产品列表</button>
            <div id="productsTableContainer">加载中...</div>
        </div>

        <div class="card">
            <h2>➕ 新增产品</h2>
            <div class="form-group">
                <label>名称 *</label>
                <input type="text" id="newName" placeholder="例如：雪球T显生成器">
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea id="newDesc" rows="2" placeholder="产品功能描述"></textarea>
            </div>
            <div class="form-group">
                <label>图片URL</label>
                <input type="text" id="newImageUrl" placeholder="https://... 或 留空显示占位符">
            </div>
            <div class="form-group">
                <label>下载链接</label>
                <input type="text" id="newDownloadUrl" placeholder="https://... 留空则不可下载">
            </div>
            <div class="form-group">
                <label>版本号</label>
                <input type="text" id="newVersion" placeholder="v1.0">
            </div>
            <div class="form-group">
                <label>文件大小</label>
                <input type="text" id="newSize" placeholder="例如 6.02 MB">
            </div>
            <div class="form-group">
                <label>状态</label>
                <select id="newStatus">
                    <option value="official">正式版</option>
                    <option value="unreleased">未发布</option>
                </select>
            </div>
            <button id="submitAddBtn">➕ 添加产品</button>
            <div id="addMessage" class="message"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ==================== Supabase 配置 ====================
    const SUPABASE_URL = 'https://sxpxsdgcmngmsteldxpq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cHhzZGdjbW5nbXN0ZWxkeHBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMjg2MjksImV4cCI6MjA5MDcwNDYyOX0.SobzjaphnRnQ2swLkK2xcZhfsCyDs7f0Zmd0TIng2WU';
    const ADMIN_PASSWORD = 'matrix2026';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let isLoggedIn = false;

    async function initAuth() {
        const { error } = await supabase.auth.signInAnonymously();
        if (error) console.error('匿名登录失败:', error);
    }

    async function getProducts() {
        const { data, error } = await supabase.from('products').select('*').order('id', { ascending: true });
        if (error) throw error;
        return data || [];
    }

    async function addProduct(product) {
        const { error } = await supabase.from('products').insert([product]);
        if (error) throw error;
    }

    async function updateProduct(id, updates) {
        const { error } = await supabase.from('products').update(updates).eq('id', id);
        if (error) throw error;
    }

    async function deleteProduct(id) {
        const { error } = await supabase.from('products').delete().eq('id', id);
        if (error) throw error;
    }

    async function renderProductsTable() {
        const container = document.getElementById('productsTableContainer');
        try {
            const products = await getProducts();
            if (!products.length) {
                container.innerHTML = '<div class="loading">暂无产品，请点击上方“新增产品”添加。</div>';
                return;
            }
            const html = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>名称</th><th>版本</th><th>大小</th><th>状态</th><th>下载链接</th><th>操作</th></tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr>
                                <td>${p.id}</td>
                                <td><strong>${escapeHtml(p.name)}</strong><br><small>${escapeHtml(p.desc || '')}</small></td>
                                <td>${p.version || '-'}</td>
                                <td>${p.size || '-'}</td>
                                <td>${p.status === 'official' ? '✅ 正式版' : '⏳ 未发布'}</td>
                                <td>${p.downloadUrl ? `<a href="${p.downloadUrl}" target="_blank">链接</a>` : '无'}</td>
                                <td class="product-actions">
                                    <button onclick="editProductPrompt(${p.id})">编辑</button>
                                    <button class="danger" onclick="deleteProductConfirm(${p.id})">删除</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            container.innerHTML = html;
        } catch (err) {
            console.error('加载产品列表失败:', err);
            container.innerHTML = `<div class="loading" style="color:#ef4444;">加载失败: ${err.message}</div>`;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.editProductPrompt = async function(id) {
        const products = await getProducts();
        const product = products.find(p => p.id === id);
        if (!product) return;
        const newName = prompt('名称', product.name);
        if (newName === null) return;
        const newDesc = prompt('描述', product.desc || '');
        const newImg = prompt('图片URL', product.imageUrl || '');
        const newUrl = prompt('下载链接', product.downloadUrl || '');
        const newVer = prompt('版本号', product.version || '');
        const newSize = prompt('文件大小', product.size || '');
        const newStatus = prompt('状态 (official/unreleased)', product.status || 'official');
        try {
            await updateProduct(id, {
                name: newName,
                desc: newDesc,
                imageUrl: newImg,
                downloadUrl: newUrl,
                version: newVer,
                size: newSize,
                status: newStatus === 'unreleased' ? 'unreleased' : 'official'
            });
            showMessage('编辑成功', 'success');
            await renderProductsTable();
        } catch (err) {
            showMessage(`编辑失败: ${err.message}`, 'error');
        }
    };

    window.deleteProductConfirm = async function(id) {
        if (!confirm('确认删除此产品？删除后不可恢复。')) return;
        try {
            await deleteProduct(id);
            showMessage('删除成功', 'success');
            await renderProductsTable();
        } catch (err) {
            showMessage(`删除失败: ${err.message}`, 'error');
        }
    };

    async function handleAddProduct() {
        const name = document.getElementById('newName').value.trim();
        if (!name) {
            showMessage('请填写产品名称', 'error', 'addMessage');
            return;
        }
        const newProduct = {
            name,
            desc: document.getElementById('newDesc').value,
            imageUrl: document.getElementById('newImageUrl').value,
            downloadUrl: document.getElementById('newDownloadUrl').value,
            version: document.getElementById('newVersion').value,
            size: document.getElementById('newSize').value,
            status: document.getElementById('newStatus').value
        };
        try {
            await addProduct(newProduct);
            showMessage('添加成功！', 'success', 'addMessage');
            document.getElementById('newName').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newImageUrl').value = '';
            document.getElementById('newDownloadUrl').value = '';
            document.getElementById('newVersion').value = '';
            document.getElementById('newSize').value = '';
            await renderProductsTable();
        } catch (err) {
            showMessage(`添加失败: ${err.message}`, 'error', 'addMessage');
        }
    }

    function showMessage(msg, type, elementId = 'addMessage') {
        const el = document.getElementById(elementId);
        el.textContent = msg;
        el.className = `message ${type}`;
        setTimeout(() => { el.className = 'message'; }, 3000);
    }

    async function loadStats() {
        try {
            const today = new Date().toISOString().slice(0, 10);
            const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
            const { data: stats, error } = await supabase.from('stats').select('*').limit(1).single();
            if (stats) {
                document.getElementById('totalViews').innerText = (stats.total || 0).toLocaleString();
                document.getElementById('todayViews').innerText = ((stats.daily || {})[today] || 0).toLocaleString();
                document.getElementById('yesterdayViews').innerText = ((stats.daily || {})[yesterday] || 0).toLocaleString();
            }
        } catch (err) {
            console.error('加载统计失败:', err);
        }
    }

    async function login() {
        const pwd = document.getElementById('adminPassword').value;
        if (pwd === ADMIN_PASSWORD) {
            isLoggedIn = true;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            await initAuth();
            await loadStats();
            await renderProductsTable();
        } else {
            alert('密码错误');
        }
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('refreshStatsBtn').addEventListener('click', loadStats);
    document.getElementById('refreshProductsBtn').addEventListener('click', renderProductsTable);
    document.getElementById('submitAddBtn').addEventListener('click', handleAddProduct);
    document.getElementById('adminPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
