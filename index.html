<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>矩阵方块</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{
            --g1:#f9fafb;--g2:#f3f4f6;--g3:#e5e7eb;--g4:#d1d5db;--g5:#9ca3af;--g6:#6b7280;--g7:#4b5563;--g8:#374151;--g9:#1f2937;--ga:#111827;
            --r:#ef4444;--o:#f97316;--accent:#3b82f6;--accent-light:#60a5fa;--red-dot:#ff3b30;
            --bg:#ffffff;--card-bg:#ffffff;--text-primary:var(--g9);--text-secondary:var(--g7);--text-tertiary:var(--g6);
            --border-color:var(--g3);--hover-bg:var(--g2);--shadow-color:rgba(0,0,0,0.08);--mask-color:rgba(0,0,0,0.5);
            --transition:all .3s cubic-bezier(0.16,1,0.3,1);
        }
        [data-theme="dark"]{
            --g1:#111827;--g2:#1f2937;--g3:#374151;--g4:#4b5563;--g5:#6b7280;--g6:#9ca3af;--g7:#d1d5db;--g8:#e5e7eb;--g9:#f3f4f6;--ga:#f9fafb;
            --bg:#0f172a;--card-bg:#1e293b;--text-primary:var(--g9);--text-secondary:var(--g7);--text-tertiary:var(--g6);
            --border-color:var(--g4);--hover-bg:var(--g2);--shadow-color:rgba(0,0,0,0.25);--mask-color:rgba(0,0,0,0.7);
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.6;color:var(--text-primary);background:var(--bg);min-height:100vh;overflow-x:hidden;transition:var(--transition)}
        .container{max-width:1200px;margin:0 auto;padding:3rem 2rem;position:relative;z-index:1}
        .top-btns{position:fixed;top:20px;right:20px;display:flex;gap:12px;z-index:999;}
        .theme-toggle,.log-btn-fixed{width:48px;height:48px;border-radius:50%;background:var(--card-bg);box-shadow:0 4px 12px var(--shadow-color);display:flex;align-items:center;justify-content:center;color:var(--text-primary);cursor:pointer;transition:var(--transition);border:1px solid var(--border-color);position:relative;}
        .log-btn-fixed .red-dot{position:absolute;top:2px;right:2px;width:12px;height:12px;background:var(--red-dot);border-radius:50%;border:2px solid var(--bg);display:none;}
        .log-btn-fixed .red-dot.show{display:block;}
        .theme-toggle:hover,.log-btn-fixed:hover{transform:scale(1.08);background:var(--accent);color:#ffffff;border-color:var(--accent);box-shadow:0 4px 12px rgba(59,130,246,0.3);}
        .nav{text-align:center;padding:3rem 0 4rem;position:relative;animation:fadeInDown .8s cubic-bezier(0.16,1,0.3,1)}
        .nav::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);width:100px;height:4px;background:linear-gradient(90deg,var(--g7),var(--g5) 25%,var(--g7) 50%,var(--g5) 75%,var(--g7));border-radius:2px;box-shadow:0 2px 4px var(--shadow-color);animation:expandWidth .6s cubic-bezier(0.16,1,0.3,1) .3s forwards}
        .nav h1{font-size:3rem;font-weight:800;margin-bottom:.5rem;letter-spacing:.05em;background:linear-gradient(135deg,var(--g9),var(--g7) 25%,var(--g9) 50%,var(--g7) 75%,var(--g9));background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientShift 8s ease infinite,fadeInUp .8s cubic-bezier(0.16,1,0.3,1) .1s both}
        .nav p{font-size:1.1rem;color:var(--text-secondary);}
        @keyframes expandWidth{to{transform:translateX(-50%) scaleX(1)}}
        @keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
        @keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .disclaimer{position:relative;margin:0 0 3rem;padding:2rem 2.5rem;background:var(--card-bg);border:2px solid var(--border-color);border-radius:2px;box-shadow:0 1px 3px var(--shadow-color),0 0 0 4px var(--bg),0 0 0 5px var(--border-color);transform:rotate(-.5deg);transition:var(--transition);animation:fadeInUp .8s cubic-bezier(0.16,1,0.3,1) .4s both}
        .disclaimer:hover{transform:rotate(0deg) scale(1.01);box-shadow:0 20px 25px -5px var(--shadow-color),0 10px 10px -5px rgba(0,0,0,0.04),0 0 0 4px var(--bg),0 0 0 5px var(--border-color)}
        .disclaimer-header{display:flex;align-items:baseline;gap:.75rem;margin-bottom:1rem;border-bottom:1px dashed var(--border-color);padding-bottom:.75rem}
        .disclaimer-stamp{font-family:'Courier New',monospace;font-size:.7rem;font-weight:bold;color:var(--r);border:2px solid var(--r);padding:.2rem .5rem;transform:rotate(-5deg);display:inline-block;text-transform:uppercase;letter-spacing:1px;opacity:.8;animation:stampPulse 2s ease-in-out infinite}
        @keyframes stampPulse{0%,100%{opacity:.8;transform:rotate(-5deg) scale(1)}50%{opacity:1;transform:rotate(-5deg) scale(1.05)}}
        .disclaimer-title{font-size:1.1rem;font-weight:600;color:var(--text-primary);font-family:'Courier New',monospace}
        .disclaimer-body{color:var(--text-secondary);font-size:.9rem;line-height:1.8;margin-bottom:1.25rem;padding-left:1rem;border-left:3px solid var(--o);transition:border-left-color .3s ease}
        .disclaimer:hover .disclaimer-body{border-left-color:var(--accent)}
        .disclaimer-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
        .disclaimer-note{font-size:.8rem;color:var(--text-tertiary);font-style:italic}
        .disclaimer-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.25rem;background:var(--g9);color:#ffffff;text-decoration:none;border-radius:4px;font-size:.85rem;font-weight:500;transition:var(--transition);box-shadow:0 4px 0 var(--ga),0 5px 15px var(--shadow-color);cursor:pointer;border:none;}
        .disclaimer-btn::before{content:'↓';font-size:.9rem}
        .disclaimer-btn:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--ga),0 3px 10px var(--shadow-color);background:var(--ga)}
        .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2.5rem;margin-bottom:3rem}
        .product{background:var(--card-bg);border-radius:1.5rem;overflow:hidden;box-shadow:0 4px 20px var(--shadow-color);transition:var(--transition);border:1px solid var(--border-color);position:relative;opacity:0;animation:fadeInUp .8s cubic-bezier(0.16,1,0.3,1) forwards;cursor:pointer}
        .product.touching{transform:scale(0.96)!important;transition:all .08s ease!important}
        .product::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-light));transform:scaleX(0);transition:transform .4s cubic-bezier(0.16,1,0.3,1);transform-origin:left}
        .product:hover{transform:translateY(-8px);box-shadow:0 25px 50px -12px var(--shadow-color);border-color:rgba(59,130,246,0.3)}
        .product:hover::before{transform:scaleX(1)}
        .product-image{width:100%;height:220px;background:var(--hover-bg);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;pointer-events:none;border-bottom:1px solid var(--border-color);}
        .app-icon{width:80px;height:80px;border-radius:1.5rem;box-shadow:0 8px 24px var(--shadow-color);transition:var(--transition);object-fit:cover;border:1px solid var(--border-color);}
        .product:hover .app-icon{transform:scale(1.1) rotateY(10deg);box-shadow:0 20px 40px rgba(59,130,246,0.3)}
        .version-badge{position:absolute;top:1rem;right:1rem;padding:.4rem 1rem;border-radius:9999px;font-size:.8rem;font-weight:600;color:#ffffff;box-shadow:0 4px 12px var(--shadow-color);backdrop-filter:blur(10px);z-index:2;border:1px solid rgba(255,255,255,0.2);}
        .official{background:linear-gradient(135deg,var(--r),#dc2626)}
        .unreleased{background:linear-gradient(135deg,var(--g7),var(--g5))}
        .product-info{padding:1.75rem}
        .product-name{font-size:1.25rem;font-weight:700;color:var(--text-primary);margin-bottom:.75rem}
        .product-desc{color:var(--text-secondary);font-size:.95rem;margin-bottom:1.5rem;line-height:1.6}
        .download-section{border-top:1px solid var(--border-color);padding-top:1.25rem}
        .download-title{font-size:.8rem;color:var(--text-tertiary);margin-bottom:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:.5rem}
        .download-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border-color),transparent)}
        .download-link{display:flex;justify-content:space-between;align-items:center;padding:.875rem 1rem;background:var(--hover-bg);border-radius:.75rem;text-decoration:none;color:var(--text-secondary);font-size:.875rem;transition:var(--transition);border:1px solid var(--border-color);cursor:pointer;}
        .download-link:hover{background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#ffffff;transform:translateX(4px);box-shadow:0 10px 25px rgba(59,130,246,0.3);border-color:var(--accent);}
        .download-info{display:flex;align-items:center;gap:.75rem;font-weight:500}
        .version{font-size:.75rem;color:var(--text-secondary);background:var(--bg);padding:.25rem .6rem;border-radius:9999px;border:1px solid var(--border-color);}
        .download-link:hover .version{background:rgba(255,255,255,0.2);color:rgba(255,255,255,0.9);border-color:transparent;}
        .size{font-size:.75rem;color:var(--text-tertiary)}
        .disabled{cursor:not-allowed;opacity:.6;pointer-events:none}
        .icon-placeholder{width:80px;height:80px;border-radius:1.5rem;background:linear-gradient(135deg,var(--g5),var(--g6));display:flex;align-items:center;justify-content:center;font-size:2rem;color:#ffffff;font-weight:700;box-shadow:0 8px 24px var(--shadow-color);border:1px solid var(--border-color);}
        .global-contact{margin-top:4rem;padding:2rem 0;border-top:1px solid var(--border-color);text-align:center;background:var(--hover-bg);border-radius:1.5rem;animation:fadeInUp .8s cubic-bezier(0.16,1,0.3,1) .9s both}
        .global-contact-inner{display:inline-flex;gap:2rem;background:var(--card-bg);padding:1rem 2rem;border-radius:1rem;box-shadow:0 4px 20px var(--shadow-color);border:1px solid var(--border-color);}
        .global-contact a{text-decoration:none;color:var(--text-secondary);font-size:.9rem;padding:.75rem 1.25rem;border-radius:.75rem;transition:var(--transition);display:flex;align-items:center;gap:.5rem;border:1px solid transparent;}
        .global-contact a:hover{background:var(--accent);color:#ffffff;transform:translateY(-2px);border-color:var(--accent);box-shadow:0 4px 12px rgba(59,130,246,0.3);}
        .footer{text-align:center;padding:3rem 0 2rem;font-size:.875rem;color:var(--text-tertiary);animation:fadeInUp .8s cubic-bezier(0.16,1,0.3,1) 1s both}
        .footer-card{background:linear-gradient(135deg,var(--card-bg) 0%,var(--hover-bg) 100%);border:1px solid var(--border-color);border-radius:1.5rem;padding:2rem;margin-bottom:1.5rem}
        .footer-time-section{display:flex;flex-direction:column;gap:1rem;margin-bottom:1.5rem}
        .time-display{display:flex;align-items:center;justify-content:center;gap:.75rem;font-family:'Courier New',monospace;font-size:1.1rem;background:var(--card-bg);padding:.75rem 1.5rem;border-radius:1rem;border:1px solid var(--border-color);color:var(--text-primary);}
        .runtime-display{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.9rem;color:var(--text-secondary);}
        .icp-link{display:inline-flex;align-items:center;gap:.5rem;color:var(--text-secondary);text-decoration:none;padding:.6rem 1.25rem;border-radius:2rem;border:1px solid var(--border-color);background:var(--card-bg);transition:var(--transition);}
        .icp-link:hover{background:var(--hover-bg);color:var(--accent);border-color:var(--accent);}
        .back-to-top{position:fixed;bottom:80px;right:20px;width:52px;height:52px;cursor:pointer;z-index:1000;opacity:0;visibility:hidden;transition:var(--transition);transform:scale(0.8)}
        .back-to-top.show{opacity:1;visibility:visible;transform:scale(1)}
        .progress-ring{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
        .progress-ring-circle{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 2px 4px rgba(59,130,246,0.3));transition:stroke-dashoffset .05s linear}
        .progress-ring-bg{fill:none;stroke:rgba(59,130,246,0.2);stroke-width:3}
        .back-to-top-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:1.2rem;transition:var(--transition);box-shadow:0 4px 12px rgba(59,130,246,0.4);border:1px solid rgba(255,255,255,0.2);}
        .back-to-top:hover .back-to-top-inner{transform:translate(-50%,-50%) scale(1.08);background:var(--accent-light);box-shadow:0 6px 20px rgba(59,130,246,0.5)}
        .back-to-top:active .back-to-top-inner{transform:translate(-50%,-50%) scale(0.95)}
        .browser-warning{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#fef3c7,#fde68a);border-bottom:2px solid #f59e0b;z-index:1001;transform:translateY(-100%);transition:transform .4s cubic-bezier(0.34,1.2,0.64,1)}
        [data-theme="dark"] .browser-warning{background:linear-gradient(135deg,#4338ca,#3730a3);border-bottom:2px solid #f59e0b}
        [data-theme="dark"] .browser-warning span{color:var(--g9);}
        [data-theme="dark"] .browser-warning i{color:#fde68a}
        .browser-warning.show{transform:translateY(0)}
        .warning-content{max-width:1200px;margin:0 auto;padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
        .warning-content i{color:#d97706;font-size:1.2rem}
        .warning-content span{flex:1;font-size:.9rem;color:#92400e}
        .warning-close{background:rgba(0,0,0,0.1);border:none;font-size:1.5rem;cursor:pointer;color:#92400e;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;border:1px solid transparent;}
        .warning-close:hover{background:rgba(0,0,0,0.2);transform:scale(1.1);border-color:rgba(0,0,0,0.2);}
        .reward-btn{position:fixed;bottom:20px;right:20px;background:linear-gradient(135deg,#f43f5e,#e11d48);color:#ffffff;border:none;padding:12px 20px;border-radius:40px;font-size:.95rem;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(244,63,94,0.3);transition:var(--transition);z-index:1000;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,0.2);}
        .reward-btn:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 8px 24px rgba(244,63,94,0.5);background:linear-gradient(135deg,#e11d48,#c0183e);}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--mask-color);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center}
        .modal.show{display:flex}
        .modal-content{background:var(--card-bg);border-radius:12px;padding:24px;width:90%;max-width:420px;text-align:center;position:relative;animation:modalPop .3s cubic-bezier(0.34,1.56,0.64,1);border:1px solid var(--border-color);box-shadow:0 10px 30px var(--shadow-color);}
        @keyframes modalPop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
        .modal-close{position:absolute;top:12px;right:16px;font-size:20px;cursor:pointer;color:var(--text-tertiary);transition:color .2s;line-height:1;}
        .modal-close:hover{color:var(--text-primary)}
        .modal-content h3{font-size:18px;margin-bottom:16px;color:var(--text-primary);display:flex;align-items:center;justify-content:center;gap:8px;}
        .modal-content h3 i{color:#f43f5e;}
        .modal-content p{font-size:14px;color:var(--text-secondary);margin-bottom:24px;line-height:1.5;}
        .qr-container{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px;}
        .qr-item{text-align:center;}
        .qr-item img{width:120px;height:120px;border-radius:8px;box-shadow:0 4px 12px var(--shadow-color);border:1px solid var(--border-color);}
        .qr-label{font-size:14px;font-weight:600;color:var(--text-primary);margin-top:8px;}
        .qr-note{font-size:12px;color:var(--text-tertiary);margin-top:4px;}
        #update-log-modal .modal-content{max-width:650px;max-height:80vh;overflow-y:auto;padding:24px;text-align:left;border-radius:16px;}
        #update-log-modal .modal-content h3{font-size:20px;margin-bottom:20px;justify-content:flex-start;color:var(--text-primary);}
        #update-log-modal .modal-content h3 i{color:var(--accent);}
        .latest-log-card{padding:16px;background:linear-gradient(135deg,rgba(96,165,250,0.1),rgba(59,130,246,0.05));border-radius:8px;border-left:4px solid var(--accent);margin-bottom:16px;border:1px solid rgba(59,130,246,0.1);}
        .log-toggle-btn{display:flex;align-items:center;gap:8px;margin:0 auto 0 0;padding:8px 16px;background:var(--hover-bg);border:none;border-radius:6px;color:var(--text-primary);cursor:pointer;transition:var(--transition);font-size:14px;border:1px solid var(--border-color);}
        .log-toggle-btn:hover{background:var(--accent);color:#ffffff;border-color:var(--accent);}
        .history-log-wrap{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-color);}
        .history-log-item{margin-bottom:16px;padding-bottom:16px;border-bottom:1px dashed var(--border-color);}
        .history-log-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
        .log-version{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
        .log-version span:first-child{font-weight:600;color:var(--text-primary);font-size:16px;}
        .log-version span:last-child{font-size:12px;color:var(--text-tertiary);}
        .log-content{padding-left:20px;}
        .log-content li{color:var(--text-secondary);font-size:14px;line-height:1.8;margin-bottom:4px;list-style:disc;}
        .log-tip{font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-color);}
        @media(max-width:640px){
            .container{padding:2rem 1rem}
            .top-btns{top:15px;right:15px;gap:8px;}
            .theme-toggle,.log-btn-fixed{width:42px;height:42px;}
            .log-btn-fixed .red-dot{width:10px;height:10px;}
            .nav h1{font-size:2.2rem}
            .nav p{font-size:1rem;}
            .products{grid-template-columns:1fr;gap:1.5rem}
            .global-contact-inner{flex-direction:column;width:100%;gap:12px;}
            .qr-container{gap:16px;}
            .qr-item img{width:110px;height:110px;}
            .back-to-top{bottom:70px;right:15px;width:46px;height:46px}
            .back-to-top-inner{width:36px;height:36px;font-size:1rem}
            .reward-btn{bottom:15px;right:15px;padding:10px 16px;font-size:.85rem;}
            #update-log-modal .modal-content{max-width:90%;padding:16px;}
            .log-toggle-btn{padding:6px 12px;font-size:13px;}
        }
    </style>
</head>
<body>
<div class="top-btns">
    <div class="theme-toggle" id="theme-toggle">
        <i class="fas fa-moon"></i>
    </div>
    <div class="log-btn-fixed" id="log-btn-fixed" title="查看更新日志">
        <i class="fas fa-history"></i>
        <span class="red-dot" id="red-dot"></span>
    </div>
</div>
<div class="container">
    <div class="nav">
        <h1>矩阵方块</h1>
        <p>解锁创意方块 · 掌握美好艺术</p>
    </div>
    <div id="disclaimer-container"></div>
    <div class="products" id="products-container"></div>
    <div class="global-contact" id="contact-container"></div>
    <div class="footer">
        <div class="footer-card">
            <div class="footer-time-section">
                <div class="time-display"><i class="far fa-clock"></i><span id="current-time">--</span></div>
                <div class="runtime-display"><i class="fas fa-heartbeat"></i><span>已运行</span><span id="site-runtime">0天0小时0分0秒</span></div>
            </div>
            <div class="icp-section" id="icp-container"></div>
        </div>
        <div class="copyright" id="copyright-container"></div>
    </div>
</div>
<div id="back-to-top" class="back-to-top">
    <svg class="progress-ring" width="52" height="52" viewBox="0 0 52 52">
        <circle class="progress-ring-bg" cx="26" cy="26" r="23" fill="none" stroke="rgba(59,130,246,0.2)" stroke-width="3"/>
        <circle class="progress-ring-circle" cx="26" cy="26" r="23" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="0"/>
    </svg>
    <div class="back-to-top-inner"><i class="fas fa-arrow-up"></i></div>
</div>
<div id="browser-warning" class="browser-warning">
    <div class="warning-content">
        <i class="fas fa-exclamation-triangle"></i>
        <span>检测到当前浏览器兼容性可能不佳，建议使用 Chrome、Edge 或 Safari 以获得最佳体验。</span>
        <button id="close-warning" class="warning-close">&times;</button>
    </div>
</div>
<button id="reward-btn" class="reward-btn"><i class="fas fa-heart"></i> 赞赏支持</button>
<div id="reward-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h3><i class="fas fa-heart"></i> 支持矩阵方块</h3>
        <p>如果这些工具对你有帮助，欢迎赞赏支持，您的支持是我们持续更新的动力～</p>
        <div class="qr-container">
            <div class="qr-item">
                <img src="./wechat_qr.png" alt="微信赞赏" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%22120%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2255%22%20font-size%3D%2212%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3E微信二维码%3C%2Ftext%3E%3C%2Fsvg%3E'">
                <div class="qr-label">微信赞赏</div>
                <div class="qr-note">微信扫码支持</div>
            </div>
            <div class="qr-item">
                <img src="./alipay_qr.png" alt="支付宝赞赏" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%22120%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2255%22%20font-size%3D%2212%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3E支付宝二维码%3C%2Ftext%3E%3C%2Fsvg%3E'">
                <div class="qr-label">支付宝赞赏</div>
                <div class="qr-note">支付宝扫码支持</div>
            </div>
        </div>
    </div>
</div>
<div id="update-log-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close update-log-close">&times;</span>
        <h3><i class="fas fa-history"></i> 版本更新日志</h3>
        <div id="latest-log-content" class="latest-log-card"></div>
        <button class="log-toggle-btn" id="log-toggle-btn">
            <i class="fas fa-chevron-down"></i>
            <span>查看往期更新</span>
        </button>
        <div class="history-log-wrap" id="history-log-wrap">
            <div id="history-log-content"></div>
        </div>
        <p class="log-tip">已查看最新更新，红点提醒已自动关闭</p>
    </div>
</div>
<script>
const siteStartTime = new Date('2026-01-23T17:00:00').getTime();
const updateLogModal = document.getElementById('update-log-modal');
const historyLogWrap = document.getElementById('history-log-wrap');
const logToggleBtn = document.getElementById('log-toggle-btn');
const logBtnFixed = document.getElementById('log-btn-fixed');
const redDot = document.getElementById('red-dot');
let logData = null;

function updateRuntime() {
    const now = Date.now(), diff = now - siteStartTime;
    document.getElementById('site-runtime').innerText = `${Math.floor(diff/864e5)}天${Math.floor(diff%864e5/36e5)}小时${Math.floor(diff%36e5/6e4)}分${Math.floor(diff%6e4/1e3)}秒`;
}
function updateClock() {
    const d = new Date();
    document.getElementById('current-time').innerText = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
setInterval(updateRuntime,1e3);
setInterval(updateClock,1e3);
updateRuntime();
updateClock();

function handleClick(el,e) {
    e.preventDefault();
    const href = el.getAttribute('href'), delay = parseInt(el.getAttribute('data-delay'))||800;
    el.classList.add('clicking');
    const p = el.closest('.product');
    p && p.classList.add('touching');
    setTimeout(() => {
        el.classList.remove('clicking');
        p && p.classList.remove('touching');
        location.href = href;
    }, delay);
    return !1;
}
window.handleDelayedClick = handleClick;

async function loadData() {
    try {
        const r = await fetch('./data.json?v='+Date.now()), d = await r.json();
        document.getElementById('disclaimer-container').innerHTML = `<div class="disclaimer"><div class="disclaimer-content"><div class="disclaimer-header"><span class="disclaimer-stamp">IMPORTANT</span><span class="disclaimer-title">${d.disclaimer.title}</span></div><div class="disclaimer-body">${d.disclaimer.body}</div><div class="disclaimer-footer"><span class="disclaimer-note">* 文件大小：${d.disclaimer.fileSize}</span><a href="${d.disclaimer.fileUrl}" class="disclaimer-btn" data-delay="800" onclick="return handleDelayedClick(this, event);">下载声明文件</a></div></div></div>`;
        const pc = document.getElementById('products-container');
        pc.innerHTML = '';
        d.products.forEach((p,i) => {
            const div = document.createElement('div');
            div.className = 'product';
            div.setAttribute('data-touchable','');
            div.style.animationDelay = `${0.5+i*0.1}s`;
            const iconHtml = p.icon ? `<img src="${p.icon}" alt="${p.name}" class="app-icon">` : '<div class="icon-placeholder">?</div>';
            const badgeClass = p.badge === 'official' ? 'official' : 'unreleased';
            const downloadHtml = p.download.enabled ? `<a href="${p.download.url}" class="download-link" data-delay="800" onclick="return handleDelayedClick(this, event);"><div class="download-info"><span>${p.download.platform}</span><span class="version">${p.download.version}</span></div><div><span class="size">${p.download.size}</span><span style="margin-left:.5rem;">→</span></div></a>` : `<div class="download-link disabled"><div class="download-info"><span>${p.download.platform}</span><span class="version">${p.download.version}</span></div><div><span class="size">${p.download.size}</span><span style="margin-left:.5rem;">→</span></div></div>`;
            div.innerHTML = `<div class="product-image">${iconHtml}<span class="version-badge ${badgeClass}">${p.badgeText}</span></div><div class="product-info"><h3 class="product-name">${p.name}</h3><p class="product-desc">${p.desc}</p><div class="download-section"><div class="download-title">下载</div>${downloadHtml}</div></div>`;
            pc.appendChild(div);
        });
        document.querySelectorAll('[data-touchable]').forEach(el => {
            el.addEventListener('touchstart',()=>{el.classList.add('touching')});
            el.addEventListener('touchend',()=>{setTimeout(()=>el.classList.remove('touching'),50)});
            el.addEventListener('touchcancel',()=>{el.classList.remove('touching')});
            el.addEventListener('mousedown',()=>{el.classList.add('touching')});
            el.addEventListener('mouseup',()=>{el.classList.remove('touching')});
            el.addEventListener('mouseleave',()=>{el.classList.remove('touching')});
        });
        const cc = document.getElementById('contact-container');
        let links = '';
        d.contacts.forEach(c => {links += `<a href="${c.url}" data-delay="800" onclick="return handleDelayedClick(this, event);"><span class="contact-icon"><i class="fas fa-${c.icon}"></i></span>${c.name}</a>`});
        cc.innerHTML = `<div class="global-contact-inner">${links}</div>`;
        document.getElementById('icp-container').innerHTML = `<a href="${d.icpLink}" target="_blank" class="icp-link"><i class="fas fa-shield-alt"></i>${d.icp}</a>`;
        document.getElementById('copyright-container').innerHTML = `<p>${d.copyright}</p>`;
    } catch (e) {
        console.error('数据加载失败',e);
        document.getElementById('products-container').innerHTML = '<p style="text-align:center;color:var(--r);padding:2rem;">数据加载失败，请检查 data.json 文件</p>';
    }
}

const themeToggle = document.getElementById('theme-toggle');
const html = document.documentElement;
const initTheme = () => {
    const savedTheme = localStorage.getItem('siteTheme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    html.setAttribute('data-theme', savedTheme);
    themeToggle.innerHTML = savedTheme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
};
themeToggle.addEventListener('click', () => {
    const currentTheme = html.getAttribute('data-theme') || 'light';
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('siteTheme', newTheme);
    themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
});
initTheme();

async function loadUpdateLog() {
    try {
        if (!logData) {
            const res = await fetch('./update-log.json?v=' + Date.now());
            logData = await res.json();
        }
        const latestVersion = logData.latestVersion;
        const localVersion = localStorage.getItem('updateLogVersion');
        renderLatestLog(logData.logs[0]);
        renderHistoryLog(logData.logs.slice(1));
        if (!localVersion || localVersion !== latestVersion) {
            redDot.classList.add('show');
        }
    } catch (e) {
        console.error('更新日志加载失败：', e);
        document.getElementById('latest-log-content').innerHTML = `<p style="color:var(--r);padding:1rem;text-align:center;">更新日志加载失败，请检查 update-log.json 文件</p>`;
    }
}
function renderLatestLog(latestLog) {
    const container = document.getElementById('latest-log-content');
    container.innerHTML = `
        <div class="log-version">
            <span>${latestLog.version} <span style="font-size:12px;font-weight:500;color:var(--accent);">(最新)</span></span>
            <span>${latestLog.date}</span>
        </div>
        <ul class="log-content">
            ${latestLog.content.map(item => `<li>${item}</li>`).join('')}
        </ul>
    `;
}
function renderHistoryLog(historyLogs) {
    const container = document.getElementById('history-log-content');
    if (historyLogs.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-tertiary);font-size:14px;padding:1rem 0;">暂无往期更新</p>';
        return;
    }
    let html = '';
    historyLogs.forEach(log => {
        html += `
            <div class="history-log-item">
                <div class="log-version">
                    <span>${log.version}</span>
                    <span>${log.date}</span>
                </div>
                <ul class="log-content">
                    ${log.content.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;
    });
    container.innerHTML = html;
}
logToggleBtn.onclick = () => {
    const isShow = historyLogWrap.style.display !== 'none';
    historyLogWrap.style.display = isShow ? 'none' : 'block';
    logToggleBtn.innerHTML = isShow 
        ? '<i class="fas fa-chevron-down"></i><span>查看往期更新</span>'
        : '<i class="fas fa-chevron-up"></i><span>收起往期更新</span>';
};
logBtnFixed.onclick = () => {
    updateLogModal.classList.add('show');
    redDot.classList.remove('show');
    localStorage.setItem('updateLogVersion', logData?.latestVersion || '');
};
function closeUpdateLog() {
    updateLogModal.classList.remove('show');
}
document.querySelector('.update-log-close').onclick = closeUpdateLog;
updateLogModal.onclick = (e) => {
    if (e.target === updateLogModal) closeUpdateLog();
};

(function() {
    const ua = navigator.userAgent.toLowerCase();
    const badBrowsers = ['baidu', 'ucbrowser', 'qqbrowser', 'sogou', '360browser'];
    const isBadBrowser = badBrowsers.some(b => ua.includes(b));
    if (isBadBrowser && !localStorage.getItem('browser_warning_closed')) {
        setTimeout(() => {
            document.getElementById('browser-warning').classList.add('show');
        }, 500);
    }
    document.getElementById('close-warning').onclick = () => {
        document.getElementById('browser-warning').classList.remove('show');
        localStorage.setItem('browser_warning_closed', 'true');
    };
})();

const rewardBtn = document.getElementById('reward-btn');
const rewardModal = document.getElementById('reward-modal');
const rewardClose = document.querySelector('#reward-modal .modal-close');
rewardBtn.onclick = () => rewardModal.classList.add('show');
rewardClose.onclick = () => rewardModal.classList.remove('show');
rewardModal.onclick = (e) => {
    if (e.target === rewardModal) rewardModal.classList.remove('show');
};
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        rewardModal.classList.remove('show');
        updateLogModal.classList.remove('show');
    }
});

const backBtn = document.getElementById('back-to-top');
const circle = document.querySelector('.progress-ring-circle');
const r = 23, c = 2 * Math.PI * r;
circle.style.strokeDasharray = c;
circle.style.strokeDashoffset = c;
function updateScroll() {
    const t = window.scrollY || document.documentElement.scrollTop;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    t > 300 ? backBtn.classList.add('show') : backBtn.classList.remove('show');
    if (h > 0) {
        const p = t / h;
        circle.style.strokeDashoffset = c * (1 - p);
    }
}
backBtn.onclick = () => {
    const s = window.scrollY;
    const d = 0 - s;
    const du = 500;
    let st = null;
    backBtn.style.transform = 'scale(0.9)';
    setTimeout(() => backBtn.style.transform = '', 150);
    function anim(t) {
        if (st === null) st = t;
        const e = Math.min((t - st) / du, 1);
        const p = 1 - Math.pow(1 - e, 3);
        window.scrollTo(0, s + d * p);
        if (e < 1) requestAnimationFrame(anim);
        else {
            window.scrollTo(0, 0);
            updateScroll();
        }
    }
    requestAnimationFrame(anim);
};
window.addEventListener('scroll', updateScroll);
window.addEventListener('resize', updateScroll);
updateScroll();

window.addEventListener('load', () => {
    loadData();
    loadUpdateLog();
});
</script>
</body>
</html>
