<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <meta name="theme-color" content="#F5F5F7" />
    <title>矩阵方块</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f5f7;
            --surface: #ffffff;
            --ink: #1d1d1f;
            --ink-2: #3a3a3c;
            --muted: #8e8e93;
            --muted-2: #aeaeb2;
            --line: #e5e5e7;
            --line-strong: #d2d2d7;
            --line-soft: #efeff1;
            --accent: #c9a96e;
            --tint: #f1f1f3;
            --tint-2: #e8e8ed;
            --on-ink: #ffffff;
            --ink-hover: #000000;
            --dot: #d2d2d7;
            --sep: #d8d8dc;
            --float-bg: rgba(29, 29, 31, 0.86);
            --on-float: #ffffff;
            --float-bg-hover: #000000;
            --on-float-track: rgba(255, 255, 255, 0.25);
            --glass-bg-soft: rgba(255, 255, 255, 0.7);
            --glass-border-hover: rgba(0, 0, 0, 0.18);
            --float-border: rgba(0, 0, 0, 0.09);
            --shadow-float: 0 2px 10px rgba(0, 0, 0, 0.06);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.6);
            --warn-bg: #1d1d1f;
            --on-ink-soft: rgba(255, 255, 255, 0.75);
            --on-ink-dim: rgba(255, 255, 255, 0.5);
            --mask: rgba(0, 0, 0, 0.45);
            --shadow-1: 0 2px 16px rgba(0, 0, 0, 0.04);
            --shadow-2: 0 8px 28px rgba(0, 0, 0, 0.07);
            --shadow-3: 0 24px 60px rgba(0, 0, 0, 0.14);
            --scroll-thumb: rgba(0, 0, 0, 0.18);
            --scroll-thumb-hover: rgba(0, 0, 0, 0.32);
            --pet-mark: #6a6a6a;
            --ring-track: rgba(0, 0, 0, 0.08);
            --r-card: 22px;
            --r-icon: 12px;
            --r-pill: 999px;
            --curve: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --t: 0.28s;
        }
        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #0d0d0f;
            --surface: #17171a;
            --ink: #f2f2f4;
            --ink-2: #d8d8dc;
            --muted: #8b8b91;
            --muted-2: #6b6b72;
            --line: #2a2a2e;
            --line-strong: #3a3a40;
            --line-soft: #202024;
            --accent: #d8b87a;
            --tint: #222226;
            --tint-2: #2c2c31;
            --on-ink: #0d0d0f;
            --ink-hover: #ffffff;
            --dot: #4a4a52;
            --sep: #3a3a40;
            --float-bg: rgba(242, 242, 244, 0.14);
            --on-float: #f2f2f4;
            --float-bg-hover: rgba(242, 242, 244, 0.24);
            --on-float-track: rgba(242, 242, 244, 0.22);
            --glass-bg-soft: rgba(52, 52, 60, 0.8);
            --glass-border-hover: rgba(255, 255, 255, 0.24);
            --float-border: rgba(255, 255, 255, 0.18);
            --shadow-float: 0 2px 12px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(28, 28, 32, 0.82);
            --glass-border: rgba(255, 255, 255, 0.1);
            --warn-bg: #f2f2f4;
            --on-ink-soft: rgba(13, 13, 15, 0.78);
            --on-ink-dim: rgba(13, 13, 15, 0.48);
            --mask: rgba(0, 0, 0, 0.62);
            --shadow-1: 0 2px 16px rgba(0, 0, 0, 0.4);
            --shadow-2: 0 8px 28px rgba(0, 0, 0, 0.5);
            --shadow-3: 0 24px 60px rgba(0, 0, 0, 0.6);
            --scroll-thumb: rgba(255, 255, 255, 0.18);
            --scroll-thumb-hover: rgba(255, 255, 255, 0.32);
            --pet-mark: #6a6a6a;
            --ring-track: rgba(0, 0, 0, 0.08);
        }
        [data-theme="champagne"] {
            color-scheme: light;
            --bg: #faf7f2;
            --surface: #fffdf9;
            --ink: #2b2621;
            --ink-2: #4a4239;
            --muted: #9a8f80;
            --muted-2: #b8ae9e;
            --line: #efe7db;
            --line-strong: #e0d5c4;
            --line-soft: #f6f1e8;
            --accent: #b8912f;
            --tint: #f4ede2;
            --tint-2: #ece2d3;
            --on-ink: #fffdf9;
            --ink-hover: #000000;
            --dot: #d8cbba;
            --sep: #ded3c3;
            --float-bg: rgba(43, 38, 33, 0.86);
            --on-float: #fffdf9;
            --float-bg-hover: rgba(0, 0, 0, 0.94);
            --on-float-track: rgba(255, 253, 249, 0.28);
            --glass-bg-soft: rgba(255, 253, 249, 0.72);
            --glass-border-hover: rgba(43, 38, 33, 0.2);
            --float-border: rgba(90, 72, 45, 0.16);
            --shadow-float: 0 2px 10px rgba(90, 72, 45, 0.08);
            --glass-bg: rgba(255, 253, 249, 0.82);
            --glass-border: rgba(255, 255, 255, 0.6);
            --warn-bg: #2b2621;
            --on-ink-soft: rgba(255, 253, 249, 0.78);
            --on-ink-dim: rgba(255, 253, 249, 0.5);
            --mask: rgba(43, 38, 33, 0.45);
            --shadow-1: 0 2px 16px rgba(90, 72, 45, 0.05);
            --shadow-2: 0 8px 28px rgba(90, 72, 45, 0.09);
            --shadow-3: 0 24px 60px rgba(90, 72, 45, 0.16);
            --scroll-thumb: rgba(90, 72, 45, 0.2);
            --scroll-thumb-hover: rgba(90, 72, 45, 0.34);
            --pet-mark: #6b6055;
            --ring-track: rgba(90, 72, 45, 0.1);
        }
        [data-theme="glacier"] {
            color-scheme: light;
            --bg: #f2f5f9;
            --surface: #ffffff;
            --ink: #16202b;
            --ink-2: #33414f;
            --muted: #8b98a6;
            --muted-2: #aab6c2;
            --line: #e2e8f0;
            --line-strong: #ccd6e1;
            --line-soft: #eef2f7;
            --accent: #4a7fb5;
            --tint: #eef2f7;
            --tint-2: #e3eaf3;
            --on-ink: #ffffff;
            --ink-hover: #000000;
            --dot: #c3cfdb;
            --sep: #cfd9e3;
            --float-bg: rgba(22, 32, 43, 0.86);
            --on-float: #ffffff;
            --float-bg-hover: rgba(0, 0, 0, 0.94);
            --on-float-track: rgba(255, 255, 255, 0.26);
            --glass-bg-soft: rgba(255, 255, 255, 0.72);
            --glass-border-hover: rgba(22, 32, 43, 0.2);
            --float-border: rgba(24, 42, 64, 0.14);
            --shadow-float: 0 2px 10px rgba(24, 42, 64, 0.07);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.6);
            --warn-bg: #16202b;
            --on-ink-soft: rgba(255, 255, 255, 0.76);
            --on-ink-dim: rgba(255, 255, 255, 0.5);
            --mask: rgba(16, 24, 33, 0.45);
            --shadow-1: 0 2px 16px rgba(24, 42, 64, 0.05);
            --shadow-2: 0 8px 28px rgba(24, 42, 64, 0.09);
            --shadow-3: 0 24px 60px rgba(24, 42, 64, 0.16);
            --scroll-thumb: rgba(24, 42, 64, 0.18);
            --scroll-thumb-hover: rgba(24, 42, 64, 0.32);
            --pet-mark: #5f6b78;
            --ring-track: rgba(24, 42, 64, 0.1);
        }
        html.theme-anim,
        html.theme-anim *,
        html.theme-anim *::before,
        html.theme-anim *::after {
            transition: background-color 0.35s var(--curve), border-color 0.35s var(--curve), color 0.35s var(--curve), fill 0.35s var(--curve), stroke 0.35s var(--curve), box-shadow 0.35s var(--curve) !important;
            transition-delay: 0s !important;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            scroll-behavior: smooth;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scroll-thumb-hover);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.7;
            color: var(--ink-2);
            background: var(--bg);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1060px;
            margin: 0 auto;
            padding: 0 1.5rem 3rem;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .nav {
            text-align: center;
            padding: 3.75rem 0 3rem;
            animation: fadeUp 0.5s var(--curve) both;
        }
        .nav-mark {
            position: relative;
            display: inline-block;
            padding-top: 1.5rem;
        }
        .nav-mark::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            width: 60%;
            height: 1px;
            background: var(--line-strong);
            transform: translateX(-50%) scaleX(0);
            transform-origin: center;
            animation: expandLine 0.55s var(--curve) 0.14s forwards;
        }
        @keyframes expandLine {
            to {
                transform: translateX(-50%) scaleX(1);
            }
        }
        .nav h1 {
            font-size: clamp(2rem, 6vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--ink);
            line-height: 1.25;
        }
        .disclaimer {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            margin-bottom: 2.25rem;
            background: var(--tint);
            border-radius: 12px;
            animation: fadeUp 0.5s var(--curve) 0.06s both;
        }
        .disclaimer-text {
            flex: 1;
            min-width: 0;
            font-size: 0.76rem;
            line-height: 1.6;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .disclaimer-text a {
            color: var(--ink);
            text-decoration: none;
            border-bottom: 1px solid var(--line);
            padding-bottom: 1px;
            transition: border-color var(--t) var(--curve);
        }
        .disclaimer-text a:hover {
            border-color: var(--ink);
        }
        .disclaimer-size {
            flex: 0 0 auto;
            font-size: 0.7rem;
            color: var(--muted-2);
        }
        .section-label {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            margin: 0 0 1rem 0.25rem;
            font-size: 0.66rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted-2);
            font-weight: 600;
            animation: fadeIn 0.5s var(--curve) both;
        }
        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }
        .jump-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(258px, 1fr));
            gap: 1rem;
            margin-bottom: 2.75rem;
        }
        .jump-card {
            display: flex;
            gap: 0.9rem;
            padding: 1.1rem 1.2rem;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: var(--shadow-1);
            text-decoration: none;
            opacity: 0;
            transform: translateY(12px);
            position: relative;
            transition: transform var(--t) var(--curve), opacity 0.4s var(--curve);
        }
        .jump-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: var(--shadow-2);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--t) var(--curve);
        }
        .jump-card.show {
            opacity: 1;
            transform: translateY(0);
        }
        .jump-card:hover {
            transform: translateY(-2px);
        }
        .jump-card:hover::after {
            opacity: 1;
        }
        .jump-card.touching {
            transform: scale(0.99) !important;
            transition: transform 0.1s var(--curve) !important;
        }
        .jump-icon-box {
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            border-radius: var(--r-icon);
            background: var(--tint);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--ink);
            transition: background var(--t) var(--curve);
        }
        .jump-card:hover .jump-icon-box {
            background: var(--tint-2);
        }
        .jump-title-wrap {
            flex: 1;
            min-width: 0;
        }
        .jump-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.01em;
            line-height: 1.4;
        }
        .jump-desc {
            margin-top: 0.2rem;
            font-size: 0.75rem;
            color: var(--muted);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .jump-link {
            position: relative;
            display: inline-block;
            margin-top: 0.5rem;
            font-size: 0.74rem;
            color: var(--ink);
        }
        .jump-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 1px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform var(--t) var(--curve);
        }
        .jump-card:hover .jump-link::after {
            transform: scaleX(1);
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.25rem;
        }
        .product {
            position: relative;
            display: flex;
            gap: 1.1rem;
            padding: 1.35rem;
            background: var(--surface);
            border-radius: var(--r-card);
            box-shadow: var(--shadow-1);
            opacity: 0;
            transform: translateY(12px);
            transition: transform var(--t) var(--curve), opacity 0.4s var(--curve);
        }
        .product::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: var(--shadow-2);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--t) var(--curve);
        }
        .product.show {
            opacity: 1;
            transform: translateY(0);
        }
        .product:hover {
            transform: translateY(-2px);
        }
        .product:hover::after {
            opacity: 1;
        }
        .product.touching {
            transform: scale(0.99) !important;
            transition: transform 0.1s var(--curve) !important;
        }
        .product-icon {
            flex: 0 0 64px;
            width: 64px;
            height: 64px;
            border-radius: var(--r-icon);
            overflow: hidden;
            background: var(--tint-2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-icon {
            width: 64px;
            height: 64px;
            display: block;
            object-fit: cover;
            border-radius: var(--r-icon);
        }
        .icon-placeholder {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--muted-2);
        }
        .product-body {
            flex: 1;
            min-width: 0;
        }
        .product-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--ink);
            line-height: 1.45;
        }
        .badge-pill {
            flex: 0 0 auto;
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--muted);
            background: var(--tint);
            padding: 0.1rem 0.45rem;
            border-radius: 6px;
        }
        .product-desc {
            margin-top: 0.3rem;
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.65;
        }
        .product-foot {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .dl-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.42rem 1.05rem;
            border: 1px solid var(--line);
            border-radius: var(--r-pill);
            background: transparent;
            color: var(--ink);
            font-size: 0.78rem;
            font-weight: 500;
            font-family: inherit;
            line-height: 1.5;
            text-decoration: none;
            cursor: pointer;
            transition: background var(--t) var(--curve), color var(--t) var(--curve), border-color var(--t) var(--curve);
        }
        .dl-btn:hover {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--on-ink);
        }
        .dl-btn.disabled {
            color: var(--muted-2);
            cursor: not-allowed;
            pointer-events: none;
        }
        .dl-btn.busy {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--on-ink);
        }
        .dl-btn.busy:hover {
            background: var(--ink-hover);
        }
        .product-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.72rem;
            color: var(--muted-2);
        }
        .version-dot {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .version-dot::before {
            content: "";
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--dot);
        }
        .contact {
            margin-top: 3.5rem;
            padding-top: 1.6rem;
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.78rem;
            animation: fadeUp 0.5s var(--curve) 0.5s both;
        }
        .contact a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--muted);
            text-decoration: none;
            transition: color var(--t) var(--curve);
        }
        .contact a:hover {
            color: var(--ink);
        }
        .contact .sep {
            color: var(--sep);
        }
        .footer {
            margin-top: 0.9rem;
            text-align: center;
            font-size: 0.72rem;
            color: var(--muted-2);
            line-height: 1.9;
            animation: fadeUp 0.5s var(--curve) 0.56s both;
        }
        .footer a {
            color: var(--muted-2);
            text-decoration: none;
            transition: color var(--t) var(--curve);
        }
        .footer a:hover {
            color: var(--ink);
        }
        .back-to-top {
            position: fixed;
            right: 22px;
            bottom: 22px;
            width: 42px;
            height: 42px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: var(--float-bg);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            color: var(--on-float);
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px) scale(0.96);
            transition: opacity var(--t) var(--curve), visibility var(--t) var(--curve), transform var(--t) var(--curve), background var(--t) var(--curve);
        }
        .back-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .back-to-top:hover {
            background: var(--float-bg-hover);
        }
        .back-to-top:active {
            transform: scale(0.94);
        }
        .progress-ring {
            position: absolute;
            inset: 0;
            width: 42px;
            height: 42px;
            transform: rotate(-90deg);
            pointer-events: none;
        }
        .progress-ring-track {
            fill: none;
            stroke: var(--on-float-track);
            stroke-width: 1.5;
        }
        .progress-ring-circle {
            fill: none;
            stroke: var(--on-float);
            stroke-width: 1.5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
        }
        .reward-btn {
            position: fixed;
            left: 22px;
            bottom: 22px;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.5rem 1rem;
            background: var(--glass-bg-soft);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid var(--float-border);
            box-shadow: var(--shadow-float);
            border-radius: var(--r-pill);
            color: var(--ink-2);
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            z-index: 1000;
            transition: all var(--t) var(--curve);
        }
        .reward-btn i {
            color: var(--muted);
            transition: color var(--t) var(--curve);
        }
        .reward-btn:hover {
            color: var(--ink);
            border-color: var(--glass-border-hover);
        }
        .reward-btn:hover i {
            color: var(--accent);
        }
        .log-btn-fixed {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--glass-bg-soft);

        }
        .theme-btn i {
            transition: transform 0.45s var(--curve);
        }
        .theme-cur {
            position: absolute;
            right: 5px;
            bottom: 5px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            border: 1.5px solid var(--surface);
            pointer-events: none;
            transition: background-color var(--t) var(--curve);
        }
        .theme-btn:hover i {
            transform: rotate(-25deg);
        }
        .theme-panel {
            position: absolute;
            top: 46px;
            right: 0;
            width: 172px;
            padding: 0.4rem;
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-3);
            border-radius: 16px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px) scale(0.97);
            transform-origin: top right;
            transition: opacity 0.2s var(--curve), visibility 0.2s var(--curve), transform 0.2s var(--curve);
        }
        .theme-switch.open .theme-panel {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .theme-panel__title {
            font-size: 0.66rem;
            letter-spacing: 0.1em;
            color: var(--muted-2);
            padding: 0.35rem 0.55rem 0.45rem;
        }
        .theme-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.5rem 0.55rem;
            border: none;
            background: transparent;
            border-radius: 11px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.78rem;
            color: var(--ink-2);
            transition: background var(--t) var(--curve);
        }
        .theme-item:hover {
            background: var(--tint);
        }
        .theme-item .sw {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--glass-border-hover);
            background: linear-gradient(135deg, var(--sw-a) 0 34%, var(--sw-b) 34% 67%, var(--sw-c) 67% 100%);
        }
        .theme-item .nm {
            flex: 1;
            text-align: left;
        }
        .theme-item .ck {
            flex: 0 0 auto;
            font-size: 0.68rem;
            color: var(--accent);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity var(--t) var(--curve), transform var(--t) var(--curve);
        }
        .theme-item.active {
            color: var(--ink);
        }
        .theme-item.active .ck {
            opacity: 1;
            transform: scale(1);
        }
        @media (max-width:640px) {
            .theme-switch {
                top: 14px;
                right: 62px;
            }
            .theme-panel {
                width: 158px;
            }
        }
        @keyframes petEnter {
            0% {
                opacity: 0;
                scale: 0.15;
                rotate: -16deg;
            }
            55% {
                opacity: 1;
                scale: 1.14;
                rotate: 4deg;
            }
            78% {
                scale: 0.93;
                rotate: -2deg;
            }
            100% {
                opacity: 1;
                scale: 1;
                rotate: 0deg;
            }
        }
        .pet-dock.enter {
            animation: petEnter 0.95s cubic-bezier(0.34, 1.4, 0.5, 1) 0.35s both;
        }
        @media (prefers-reduced-motion: reduce) {
            .pet-dock.enter {
                animation: none;
            }
        }
    </style>
</head>

    <script src="data.js"></script>

    <script>
        const $ = id => document.getElementById(id);
        const SITE_START = new Date("2026-01-23T17:00:00").getTime();

        function updateRuntime() {
            const diff = Date.now() - SITE_START,
                d = Math.floor(diff / 864e5),
                h = Math.floor((diff % 864e5) / 36e5),
                m = Math.floor((diff % 36e5) / 6e4),
                el = $("sr");
            if (el) el.textContent = `${d} 天 ${h} 小时 ${m} 分`;
        }

        function handleDelayedClick(el, e) {
            e.preventDefault();
            const href = el.getAttribute("href"),
                delay = parseInt(el.getAttribute("data-delay")) || 260,
                card = el.closest(".product") || el.closest(".jump-card");
            if (card) card.classList.add("touching");
            setTimeout(() => { if (card) card.classList.remove("touching"); if (href && href !== "#") location.href = href; }, delay);
            return false;
        }
        window.handleDelayedClick = handleDelayedClick;

        function renderDisclaimer(d) {
            const s = d.disclaimer;
            if (!s) return;
            $("dc").innerHTML = `<div class="disclaimer"><p class="disclaimer-text">下载或使用本站软件即视为同意<a href="${s.fileUrl}" onclick="return openDisclaimer(event);">《${s.title}》</a></p><span class="disclaimer-size">${s.fileSize}</span></div>`;
        }

        function renderJumpCards(list) {
            const box = $("jumpCardContainer");
            box.innerHTML = "";
            (list || []).filter(i => i.enabled !== false).forEach(i => {
                const a = document.createElement("a");
                a.href = i.url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "jump-card";
                a.setAttribute("data-delay", "260");
                a.setAttribute("onclick", "return handleDelayedClick(this, event);");
                const iconClass = i.icon && i.icon.includes(" ") ? i.icon : `fas fa-${i.icon || "link"}`;
                a.innerHTML =
                    `<div class="jump-icon-box"><i class="${iconClass}"></i></div><div class="jump-title-wrap"><h3 class="jump-name">${i.name}</h3><p class="jump-desc">${i.desc}</p><span class="jump-link">立即访问</span></div>`;
                box.appendChild(a);
            });
        }

        function renderProducts(list) {
            const box = $("pc");
            box.innerHTML = "";
            list.forEach((p, i) => {
                const card = document.createElement("div");
                card.className = "product";
                const icon = p.icon ? `<div class="product-icon"><img src="${p.icon}" alt="${p.name}" class="app-icon" loading="lazy" /></div>` :
                    `<div class="product-icon icon-placeholder">${p.name.charAt(0)}</div>`;
                const dl = p.download.enabled ? `<button type="button" class="dl-btn" onclick="return startDownload(${i}, this, event);">下载 · ${p.download.platform}</button>` :
                    `<span class="dl-btn disabled">${p.download.version}</span>`;
                const meta = `<span>${p.download.size}</span>` + (p.download.enabled ? `<span class="version-dot">${p.download.version}</span>` :
                    "");
                card.innerHTML =
                    `${icon}<div class="product-body"><h3 class="product-name">${p.name}<span class="badge-pill">${p.badgeText}</span></h3><p class="product-desc">${p.desc}</p><div class="product-foot">${dl}<div class="product-meta">${meta}</div></div></div>`;
                box.appendChild(card);
            });
        }

        function renderContacts(list, icp, copyright) {
            $("cc").innerHTML = (list || []).map(i =>
                    `<a href="${i.url}" data-delay="260" onclick="return handleDelayedClick(this, event);"><i class="fas fa-${i.icon}"></i>${i.name}</a>`
                ).join('<span class="sep">|</span>');
            $("ic").innerHTML = icp ? `<a href="${icp.link}" target="_blank" rel="noopener noreferrer">${icp.text}</a>` : "";
            $("c").innerHTML = copyright ? `${copyright} · 已运行 <span id="sr">--</span>` : "";
        }

        function observeReveal() {
            const items = document.querySelectorAll(".product, .jump-card");
            if (!("IntersectionObserver" in window)) { items.forEach(el => el.classList.add("show")); return; }
            const io = new IntersectionObserver(entries => {
                entries.filter(en => en.isIntersecting).forEach((en, i) => {
                    const el = en.target;
                    el.style.transitionDelay = Math.min(i, 5) * 45 + "ms";
                    el.classList.add("show");
                    setTimeout(() => el.style.transitionDelay = "", 700);
                    io.unobserve(el);
                });
            }, { threshold: 0.08, rootMargin: "0px 0px -32px 0px" });
            items.forEach(el => io.observe(el));
        }
        const scrollHandlers = [];
        let scrolling = false;

        function onScrollFrame() {
            const y = window.scrollY || document.documentElement.scrollTop,
                max = document.documentElement.scrollHeight - window.innerHeight || 1,
                p = Math.min(Math.max(y / max, 0), 1);
            scrollHandlers.forEach(fn => fn(y, p));
            scrolling = false;
        }

        function requestScrollUpdate() { if (scrolling) return;
            scrolling = true;
            requestAnimationFrame(onScrollFrame); }
        window.addEventListener("scroll", requestScrollUpdate, { passive: true });
        window.addEventListener("resize", requestScrollUpdate, { passive: true });

        function lockScroll() {
            const sw = window.innerWidth - document.documentElement.clientWidth;
            document.body.style.overflow = "hidden";
            if (sw > 0) document.body.style.paddingRight = sw + "px";
        }

        function unlockScroll() {
            document.body.style.overflow = "";
            document.body.style.paddingRight = "";
        }

        function loadData() {
            const d = window.siteData;
            if (!d) { $("pc").innerHTML = '<p class="load-error">数据加载失败，请检查 data.js</p>'; return; }
            window.__products = d.products;
            renderDisclaimer(d);
            renderJumpCards(d.jumpCards);
            renderProducts(d.products);
            renderContacts(d.contacts, d.icpLink ? { text: d.icp, link: d.icpLink } : null, d.copyright);
            updateRuntime();
            observeReveal();
        }
        (function() {
            const ua = navigator.userAgent.toLowerCase();
            if ((ua.includes("baidu") || ua.includes("ucbrowser") || ua.includes("qqbrowser") || ua.includes("sogou")) && !localStorage
                .getItem("b_w_c")) setTimeout(() => $("bw").classList.add("show"), 600);
            $("cw").onclick = () => { $("bw").classList.remove("show");
                localStorage.setItem("b_w_c", "true"); };
        })();

        function openModal(m) { m.classList.remove("hiding");
            m.classList.add("show");
            lockScroll(); }

        function closeModal(m) {
            if (!m.classList.contains("show")) return;
            m.classList.add("hiding");
            setTimeout(() => { m.classList.remove("show", "hiding"); if (!document.querySelector(".modal.show")) unlockScroll(); },
            280);
        }
        document.querySelectorAll(".modal").forEach(m => {
            m.addEventListener("click", e => { if (e.target === m || e.target.classList.contains("modal-close")) closeModal(
                    m); });
        });
        (function() { $("rb").onclick = () => openModal($("rm")); })();
        (function() {
            const btn = $("btt"),
                ring = $("prc"),
                R = 19,
                C = 2 * Math.PI * R;
            ring.style.strokeDasharray = C;
            ring.style.strokeDashoffset = C;
            let visible = false;
            scrollHandlers.push((y, p) => {
                ring.style.strokeDashoffset = C * (1 - p);
                const should = y > 300;
                if (should !== visible) { visible = should;
                    btn.classList.toggle("show", should); }
            });
            btn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
            requestScrollUpdate();
        })();
        (function() {
            const m = $("ulm"),
                dot = $("rd"),
                lL = $("llc"),
                hL = $("hlw"),
                tB = $("ltb"),
                tips = $("ut"),
                tipsV = $("utv"),
                tipsC = $("utc-content"),
                saved = localStorage.getItem("uLV"),
                historyOpen = localStorage.getItem("lHS") === "show";

            function renderLog() {
                if (!window.logData) return;
                const { logs } = window.logData;
                lL.innerHTML =
                    `<div class="log-version"><span class="v">${logs[0].version}<small>最新</small></span><span class="d">${logs[0].date}</span></div><ul class="log-content">${logs[0].content.map(i => `<li>${i}</li>`).join("")}</ul>`;
                if (logs.length <= 1) { hL.innerHTML = '<p class="log-tip">暂无往期更新</p>';
                    tB.style.display = "none"; return; }
                hL.innerHTML = '<div class="history-inner">' + logs.slice(1).map(i =>
                    `<div class="log-history-item"><div class="log-version"><span class="v">${i.version}</span><span class="d">${i.date}</span></div><ul class="log-content">${i.content.map(it => `<li>${it}</li>`).join("")}</ul></div>`
                    ).join("") + "</div>";
                if (historyOpen) { hL.classList.add("show");
                    tB.innerHTML = '<i class="fas fa-chevron-up"></i> 收起往期更新'; }
            }

            function openLogModal() {
                openModal(m);
                dot.classList.remove("show");
                tips.classList.remove("show");
                if (window.logData) localStorage.setItem("uLV", window.logData.latestVersion);
            }
            tB.onclick = () => {
                const open = hL.classList.toggle("show");
                tB.innerHTML = open ? '<i class="fas fa-chevron-up"></i> 收起往期更新' :
                    '<i class="fas fa-chevron-down"></i> 查看往期更新';
                localStorage.setItem("lHS", open ? "show" : "hide");
            };
            $("lbf").onclick = openLogModal;
            $("utbd").onclick = () => { tips.classList.remove("show");
                openLogModal(); };
            $("utbl").onclick = () => tips.classList.remove("show");
            $("utc").onclick = () => tips.classList.remove("show");
            document.addEventListener("keydown", e => { if (e.key !== "Escape") return;
                document.querySelectorAll(".modal.show").forEach(el => closeModal(el));
                tips.classList.remove("show"); });
            window.addEventListener("load", () => {
                renderLog();
                if (!window.logData) return;
                if (!saved || saved !== window.logData.latestVersion) {
                    dot.classList.add("show");
                    setTimeout(() => { tipsV.textContent = window.logData.latestVersion;
                        tipsC.textContent = window.logData.logs[0].content.join("；");
                        tips.classList.add("show"); }, 900);
                }
            });
        })();
        loadData();
        setInterval(updateRuntime, 30000);
        const DISCLAIMER_KEY = "dlDisclaimerAccepted";

        function disclaimerCfg() { return (window.siteData && window.siteData.disclaimer) || {}; }

        function disclaimerAccepted() {
            const cfg = disclaimerCfg();
            if (cfg.requireAcceptBeforeDownload === false) return true;
            try { const raw = localStorage.getItem(DISCLAIMER_KEY); if (!raw) return false; const days = cfg
                    .acceptRememberDays; if (days === 0) return true; return Date.now() - parseInt(raw, 10) < (days ||
                    30) * 864e5; } catch (e) { return false; }
        }

        function acceptDisclaimer() { try { localStorage.setItem(DISCLAIMER_KEY, String(Date.now())); } catch (e) {} }
        (function() {
            const m = $("dm"),
                check = $("dmCheck"),
                ok = $("dmOk");
            let pending = null;
            check.onchange = () => ok.disabled = !check.checked;

            function close() { closeModal(m);
                pending = null; }
            ok.onclick = () => { acceptDisclaimer(); const fn = pending;
                close(); if (fn) setTimeout(fn, 260); };
            $("dmCancel").onclick = close;
            $("dmFile").onclick = () => { const d = disclaimerCfg(); if (!d.fileUrl) return;
                Downloader.start(-1, { name: d.title || "免责声明", download: { url: d.fileUrl, filename: (d.title ||
                            "disclaimer") + ".pdf", mode: "auto" } }); };
            window.showDisclaimerModal = function(cb) {
                const d = disclaimerCfg();
                $("dmTitle").textContent = d.title || "免责声明";
                $("dmBody").textContent = d.body || "";
                $("dmFileText").textContent = "下载《" + (d.title || "声明") + "》· " + (d.fileSize || "");
                check.checked = false;
                ok.disabled = true;
                pending = cb || null;
                openModal(m);
            };
            window.openDisclaimer = function(e) { if (e) e.preventDefault();
                window.showDisclaimerModal(null); return false; };
        })();
        const Downloader = (function() {
            const dock = $("petDock"),
                panel = $("petProgress"),
                ring = $("petRing"),
                fill = $("petFill"),
                pctEl = $("petPct"),
                sizeEl = $("petSize"),
                speedEl = $("petSpeed"),
                RING_C = 2 * Math.PI * 104;
            ring.style.strokeDasharray = RING_C;
            ring.style.strokeDashoffset = RING_C;
            let ctrl = null,
                active = false,
                curIndex = -1,
                curBtn = null;

            function cfg() { return (window.siteData && window.siteData.downloadConfig) || {}; }

            function fmt(b) {
                if (b === null || b === undefined || isNaN(b)) return "--";
                if (b < 1024) return b + " B";
                if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
                if (b < 1073741824) return (b / 1048576).toFixed(2) + " MB";
                return (b / 1073741824).toFixed(2) + " GB";
            }

            function syncPosition() {
                const r = dock.getBoundingClientRect(),
                    need = 78,
                    flip = r.right + need > window.innerWidth;
                panel.classList.toggle("flipped", flip);
                panel.style.left = (flip ? Math.max(4, r.left - need + 10) : r.right + 10) + "px";
                panel.style.top = Math.max(4, r.top + r.height / 2 - 78) + "px";
            }

            function setUI(pct, loaded, total, speed) {
                const p = Math.max(0, Math.min(100, pct)),
                    known = total > 0;
                panel.classList.toggle("indeterminate", !known);
                ring.style.strokeDashoffset = RING_C * (1 - (known ? p / 100 : 0));
                if (known) fill.style.height = p + "%";
                pctEl.textContent = known ? Math.round(p) + "%" : fmt(loaded);
                sizeEl.textContent = known ? fmt(loaded) + " / " + fmt(total) : "已下载 " + fmt(loaded);
                speedEl.textContent = cfg().showSpeed !== false && speed > 0 ? fmt(speed) + "/s" : "";
            }

            function nameFromHeaders(h, fallback) {
                const cd = h.get("Content-Disposition") || "";
                let m = cd.match(/filename\*\s*=\s*UTF-8''([^;]+)/i);
                if (m) { try { return decodeURIComponent(m[1]); } catch (e) {} }
                m = cd.match(/filename\s*=\s*"?([^";]+)"?/i);
                if (m) { try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } }
                return fallback;
            }

            function guessName(url) { try { const u = new URL(url, location.href); return u.searchParams.get("fn") || u
                        .searchParams.get("download_name") || ""; } catch (e) { return ""; } }

            function saveBlob(blob, name) { const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = name || "download";
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { URL.revokeObjectURL(a.href);
                    a.remove(); }, 2000); }

            function fatalError(msg) { const e = new Error(msg);
                e.noFallback = true; return e; }

            function friendlyMsg(msg) { const s = String(msg || ""); if (/失效|已删除|已过期|不存在|expired|not ?found/i.test(s))
                    return "分享已失效"; if (/解析异常|解析失败|parse/i.test(s)) return "解析失败"; if (/密码|pwd|password/i.test(s))
                    return "需要提取码"; return s.replace(/https?:\/\/\S+/g, "").trim().slice(0, 24) || "资源不可用"; }

            function reset() {
                active = false;
                curIndex = -1;
                ctrl = null;
                dock.classList.remove("downloading", "done");
                panel.classList.remove("visible", "error", "indeterminate");
                ring.style.strokeDashoffset = RING_C;
                fill.style.height = "0%";
                if (curBtn) { curBtn.textContent = curBtn.dataset.text || "下载";
                    curBtn.classList.remove("busy");
                    curBtn.removeAttribute("title");
                    curBtn = null; }
            }

            function finish(holdMs, after) {
                dock.classList.remove("downloading");
                dock.classList.add("done");
                setTimeout(() => { const fn = after;
                    reset(); if (fn) fn(); }, holdMs);
            }
            async function start(i, p, btn) {
                if (active) return;
                const d = p.download || {},
                    c = cfg(),
                    mode = d.mode || c.mode || "auto",
                    fallback = c.fallbackToDirect !== false;
                if (mode === "direct") { location.href = d.url; return; }
                active = true;
                curIndex = i;
                curBtn = btn;
                ctrl = new AbortController();
                $("pet").classList.remove("idle-sleep");
                $("zzz").classList.remove("show");
                panel.classList.remove("error", "indeterminate");
                dock.classList.remove("done");
                dock.classList.add("downloading");
                panel.classList.add("visible");
                syncPosition();
                if (btn) { btn.dataset.text = btn.textContent;
                    btn.textContent = "下载中…";
                    btn.title = "点击取消";
                    btn.classList.add("busy"); }
                setUI(0, 0, 0, 0);
                sizeEl.textContent = "连接中…";
                try {
                    const res = await fetch(d.url, { signal: ctrl.signal, mode: "cors", credentials: "omit" });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const ct = (res.headers.get("Content-Type") || "").toLowerCase(),
                        total = parseInt(res.headers.get("Content-Length"), 10) || 0;
                    if (ct.includes("json")) {
                        let msg = "资源不可用";
                        try { const j = await res.json(); if (j && j.msg) msg = String(j.msg); } catch (e) {}
                        throw fatalError(friendlyMsg(msg));
                    }
                    if (!res.body) throw new Error("浏览器不支持流式读取");
                    const reader = res.body.getReader();
                    const chunks = [];
                    let loaded = 0,
                        speed = 0,
                        lastT = performance.now(),
                        lastL = 0;
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        loaded += value.length;
                        const now = performance.now();
                        if (now - lastT > 300) {
                            speed = (loaded - lastL) / ((now - lastT) / 1000);
                            lastT = now;
                            lastL = loaded;
                            setUI(total ? (loaded / total) * 100 : 0, loaded, total, speed);
                        }
                    }
                    const blob = new Blob(chunks);
                    const name = nameFromHeaders(res.headers, d.filename || guessName(d.url) || p.name + ".apk");
                    saveBlob(blob, name);
                    setUI(100, blob.size, total || blob.size, 0);
                    pctEl.textContent = "完成";
                    sizeEl.textContent = fmt(blob.size);
                    speedEl.textContent = name.length > 16 ? name.slice(0, 14) + "…" : name;
                    finish(1600);
                } catch (err) {
                    if (err && err.name === "AbortError") { reset(); return; }
                    const msg = (err && err.message) || "下载失败",
                        canFallback = mode === "auto" && fallback && !err.noFallback;
                    if (canFallback) {
                        pctEl.textContent = "直连";
                        sizeEl.textContent = "改用直接下载";
                        speedEl.textContent = "";
                        fill.style.height = "100%";
                        finish(900, () => { location.href = d.url; });
                    } else {
                        pctEl.textContent = "失败";
                        sizeEl.textContent = msg.slice(0, 26);
                        speedEl.textContent = "点击可重试";
                        panel.classList.add("error");
                        fill.style.height = "100%";
                        finish(3200);
                    }
                }
            }

            function cancel() { if (!active) return; if (ctrl) ctrl.abort();
                reset(); }
            return { start, cancel, syncPosition, isActive: () => active, currentIndex: () => curIndex };
        })();
        window.startDownload = function(i, btn, e) {
            if (e) { e.preventDefault();
                e.stopPropagation(); }
            const p = (window.__products || [])[i];
            if (!p) return false;
            if (Downloader.isActive()) { if (Downloader.currentIndex() === i) Downloader.cancel(); return false; }
            const run = () => { if (btn) { const card = btn.closest(".product"); if (card) { card.classList.add(
                        "touching");
                        setTimeout(() => card.classList.remove("touching"), 240); } }
                setTimeout(() => Downloader.start(i, p, btn), 240); };
            if (!disclaimerAccepted()) { window.showDisclaimerModal(run); return false; }
            run();
            return false;
        };
        (function() {
            const pet = $("pet"),
                eyes = pet.querySelectorAll(".eye"),
                zzz = $("zzz");
            let cx = 0,
                cy = 0;

            function measure() { const r = pet.getBoundingClientRect();
                cx = r.left + r.width / 2;
                cy = r.top + r.height / 2; }
            let targetX = 0,
                targetY = 0,
                curX = 0,
                curY = 0,
                smoothX = 0,
                smoothY = 0,
                isLooking = false,
                lookX = 0,
                lookY = 0,
                scrollLookX = 0,
                scrollLookY = 0,
                scrollResetTimer = null,
                lastScrollY = 0;
            const EYE_MAX = 20,
                FOLLOW = 0.18,
                SMOOTH = 0.3,
                LOOK_MAX = 35,
                SCROLL_LOOK = 14;
            let kickX = 0,
                kickY = 0,
                goalX = 0,
                goalY = 0,
                isKicking = false,
                isReturning = false,
                pressScale = 1,
                pressTarget = 1,
                isDizzy = false,
                idleTimer = null,
                sleepTimer = null,
                dragFrom = null,
                dragging = false;
            const dock = $("petDock"),
                POS_KEY = "petPos";

            function setPos(x, y) { const r = dock.getBoundingClientRect();
                x = Math.max(0, Math.min(x, window.innerWidth - r.width));
                y = Math.max(0, Math.min(y, window.innerHeight - r.height));
                dock.style.left = x + "px";
                dock.style.top = y + "px";
                measure();
                Downloader.syncPosition(); }

            function savePos() { const r = dock.getBoundingClientRect(); try { localStorage.setItem(POS_KEY, JSON.stringify({ x: Math
                            .round(r.left), y: Math.round(r.top) })); } catch (e) {} }

            function restorePos() { let p = null; try { p = JSON.parse(localStorage.getItem(POS_KEY)); } catch (e) {} if (p &&
                    typeof p.x === "number") setPos(p.x, p.y); }
            let eyeRaf = null,
                kickRaf = null;

            function setEyes(x, y) { const dx = x - cx,
                    dy = y - cy;
                targetX = Math.max(-EYE_MAX, Math.min(EYE_MAX, dx * 0.18));
                targetY = Math.max(-EYE_MAX, Math.min(EYE_MAX, dy * 0.18));
                wakeEyes(); }

            function eyeLoop() {
                const px = Math.max(-EYE_MAX, Math.min(EYE_MAX, targetX)),
                    py = Math.max(-EYE_MAX, Math.min(EYE_MAX, targetY)),
                    tx = scrollLookX ? Math.max(-EYE_MAX, Math.min(EYE_MAX, px * 0.35 + scrollLookX)) : px,
                    ty = scrollLookY ? Math.max(-EYE_MAX, Math.min(EYE_MAX, py * 0.35 + scrollLookY)) : py;
                if (isLooking) { smoothX += (lookX - smoothX) * SMOOTH;
                    smoothY += (lookY - smoothY) * SMOOTH; } else { curX += (tx - curX) * FOLLOW;
                    curY += (ty - curY) * FOLLOW;
                    smoothX += (curX - smoothX) * SMOOTH;
                    smoothY += (curY - smoothY) * SMOOTH; }
                const t = `translate(${smoothX.toFixed(2)}px, ${smoothY.toFixed(2)}px)`;
                for (const e of eyes) e.style.transform = t;
                const settled = !isLooking && Math.abs(curX - smoothX) < 0.05 && Math.abs(curY - smoothY) < 0.05 && Math
                    .abs(tx - curX) < 0.05 && Math.abs(ty - curY) < 0.05;
                if (settled) { eyeRaf = null; return; }
                eyeRaf = requestAnimationFrame(eyeLoop);
            }

            function wakeEyes() { if (eyeRaf === null) eyeRaf = requestAnimationFrame(eyeLoop); }

            function kickLoop() {
                if (isKicking) { kickX += (goalX - kickX) * 0.25;
                    kickY += (goalY - kickY) * 0.25; if (Math.abs(goalX - kickX) < 0.5 && Math.abs(goalY - kickY) < 0.5) {
                        kickX = goalX;
                        kickY = goalY;
                        isKicking = false;
                        isReturning = true;
                        isLooking = false; } } else if (isReturning) { kickX += (0 - kickX) * 0.1;
                    kickY += (0 - kickY) * 0.1; if (Math.abs(kickX) < 0.2 && Math.abs(kickY) < 0.2) { kickX = 0;
                        kickY = 0;
                        isReturning = false; } }
                pressScale += (pressTarget - pressScale) * 0.2;
                if (Math.abs(pressTarget - pressScale) < 0.002) pressScale = pressTarget;
                if (!isDizzy) pet.style.transform =
                    `translate3d(${kickX.toFixed(2)}px, ${kickY.toFixed(2)}px, 0) scale(${pressScale.toFixed(3)})`;
                const idle = !isKicking && !isReturning && kickX === 0 && kickY === 0 && pressScale === 1;
                if (idle) { kickRaf = null; return; }
                kickRaf = requestAnimationFrame(kickLoop);
            }

            function wakeKick() { if (kickRaf === null) kickRaf = requestAnimationFrame(kickLoop); }

            function lookAt(x, y) { const dx = x - cx,
                    dy = y - cy,
                    dist = Math.sqrt(dx * dx + dy * dy) || 1;
                lookX = (dx / dist) * LOOK_MAX;
                lookY = (dy / dist) * LOOK_MAX;
                isLooking = true;
                wakeEyes(); }

            function kickBack(x, y) { const dx = x - cx,
                    dy = y - cy,
                    dist = Math.sqrt(dx * dx + dy * dy) || 1;
                goalX = -(dx / dist) * 22;
                goalY = -(dy / dist) * 22;
                isKicking = true;
                isReturning = false;
                lookAt(x, y);
                wakeKick(); }
            let clicks = [];

            function checkMultiClick() {
                if (isDizzy) return;
                const now = Date.now();
                clicks.push(now);
                clicks = clicks.filter(t => now - t < 1500);
                if (clicks.length >= 3) { clicks = [];
                    triggerDizzy(); }
            }

            function triggerDizzy() {
                isDizzy = true;
                pet.classList.add("dizzy");
                let shakes = 0;
                const timer = setInterval(() => { const o = shakes % 2 === 0 ? 3 : -3;
                    pet.style.transform = `translate3d(${o}px,0,0) rotate(${o*2}deg)`;
                    if (++shakes >= 6) { clearInterval(timer);
                        pet.classList.remove("dizzy");
                        isDizzy = false;
                        kickX = kickY = 0;
                        pet.style.transform = "";
                        isReturning = false; } }, 80);
            }

            function showZzz() { zzz.classList.remove("show");
                void zzz.offsetWidth;
                zzz.classList.add("show"); }

            function startIdle() {
                clearTimeout(idleTimer);
                clearInterval(sleepTimer);
                idleTimer = setTimeout(() => { pet.classList.add("idle-sleep");
                    showZzz();
                    sleepTimer = setInterval(showZzz, 3000); }, 5000);
            }
            let lastReset = 0;

            function resetIdle(force) { const now = Date.now(); if (!force && now - lastReset < 400) return;
                lastReset = now;
                pet.classList.remove("idle-sleep");
                zzz.classList.remove("show");
                startIdle(); }

            function blink() { if (isDizzy) return;
                pet.classList.add("blink");
                setTimeout(() => pet.classList.remove("blink"), 120); }
            document.addEventListener("pointermove", e => { setEyes(e.clientX, e.clientY);
                resetIdle(); });
            document.addEventListener("pointerleave", () => { targetX = targetY = 0;
                wakeEyes();
                startIdle(); });
            document.addEventListener("touchmove", e => { const t = e.touches[0]; if (!t) return;
                setEyes(t.clientX, t.clientY);
                resetIdle(); }, { passive: true });
            document.addEventListener("touchend", () => { targetX = targetY = 0;
                wakeEyes();
                startIdle(); }, { passive: true });
            scrollHandlers.push(y => { const dy = y - lastScrollY;
                lastScrollY = y; if (Math.abs(dy) < 0.5) return;
                scrollLookY = (dy > 0 ? 1 : -1) * SCROLL_LOOK;
                scrollLookX = 0;
                wakeEyes();
                clearTimeout(scrollResetTimer);
                scrollResetTimer = setTimeout(() => { scrollLookY = 0;
                    wakeEyes(); }, 220); });
            const DRAG_THRESHOLD = 6;
            pet.addEventListener("pointerdown", e => {
                e.preventDefault();
                const r = dock.getBoundingClientRect();
                dragFrom = { x: e.clientX, y: e.clientY, left: r.left, top: r.top };
                dragging = false;
                pressTarget = 0.94;
                pet.classList.add("pressed");
                wakeKick();
                resetIdle(true);
                try { pet.setPointerCapture(e.pointerId); } catch (err) {}
            });
            pet.addEventListener("pointermove", e => {
                if (!dragFrom) return;
                const dx = e.clientX - dragFrom.x,
                    dy = e.clientY - dragFrom.y;
                if (!dragging && Math.hypot(dx, dy) > DRAG_THRESHOLD) { dragging = true;
                    dock.classList.add("dragging");
                    pressTarget = 1;
                    wakeKick(); }
                if (dragging) setPos(dragFrom.left + dx, dragFrom.top + dy);
            });

            function endPointer() {
                if (dragFrom) { dragFrom = null; if (dragging) { dragging = false;
                        dock.classList.remove("dragging");
                        savePos(); } }
                pressTarget = 1;
                pet.classList.remove("pressed");
                wakeKick();
            }
            pet.addEventListener("pointerup", e => { const wasDrag = dragging;
                endPointer(); if (wasDrag || isDizzy) return;
                kickBack(e.clientX, e.clientY);
                checkMultiClick();
                resetIdle(true); });
            pet.addEventListener("pointercancel", endPointer);
            window.addEventListener("resize", () => { measure(); const r = dock.getBoundingClientRect();
                setPos(r.left, r.top); });
            window.addEventListener("load", () => { measure();
                restorePos();
                Downloader.syncPosition(); });
            measure();
            restorePos();
            (function enter() { const reduce = window.matchMedia ? window.matchMedia(
                    "(prefers-reduced-motion: reduce)").matches : false; if (reduce) return;
                dock.classList.add("enter"); const off = () => dock.classList.remove("enter");
                dock.addEventListener("animationend", e => { if (e.target === dock) off(); });
                setTimeout(off, 2000); })();
            setInterval(blink, 3000);
            startIdle();
            eyeRaf = requestAnimationFrame(eyeLoop);
        })();
        (function() {
            const THEMES = [{ id: "light", name: "极简白", bar: "#f5f5f7", sw: ["#f5f5f7", "#1d1d1f", "#c9a96e"] },
                { id: "dark", name: "暗夜黑", bar: "#0d0d0f", sw: ["#0d0d0f", "#f2f2f4", "#d8b87a"] },
                { id: "champagne", name: "香槟金", bar: "#faf7f2", sw: ["#faf7f2", "#2b2621", "#b8912f"] },
                { id: "glacier", name: "静谧蓝", bar: "#f2f5f9", sw: ["#f2f5f9", "#16202b", "#4a7fb5"] }
            ];
            const KEY = "siteTheme",
                root = document.documentElement,
                meta = document.querySelector('meta[name="theme-color"]'),
                wrap = document.getElementById("themeSwitch"),
                btn = document.getElementById("themeBtn"),
                panel = document.getElementById("themePanel");
            if (!wrap || !btn || !panel) return;
            let animTimer = null;
            const items = THEMES.map(t => {
                const el = document.createElement("button");
                el.className = "theme-item";
                el.type = "button";
                el.dataset.theme = t.id;
                el.setAttribute("role", "menuitemradio");
                el.innerHTML =
                    '<span class="sw"></span><span class="nm"></span><i class="fas fa-check ck"></i>';
                el.querySelector(".sw").style.setProperty("--sw-a", t.sw[0]);
                el.querySelector(".sw").style.setProperty("--sw-b", t.sw[1]);
                el.querySelector(".sw").style.setProperty("--sw-c", t.sw[2]);
                el.querySelector(".nm").textContent = t.name;
                el.addEventListener("click", e => { e.stopPropagation();
                    apply(t.id, true);
                    setOpen(false); });
                panel.appendChild(el);
                return el;
            });

            function current() { const id = root.getAttribute("data-theme"); return THEMES.some(t => t.id === id) ? id :
                    "light"; }

            function apply(id, animate) {
                const t = THEMES.filter(x => x.id === id)[0] || THEMES[0];
                if (animate) { root.classList.add("theme-anim");
                    clearTimeout(animTimer);
                    animTimer = setTimeout(function() { root.classList.remove("theme-anim"); }, 420); }
                root.setAttribute("data-theme", t.id);
                if (meta) meta.setAttribute("content", t.bar);
                items.forEach(el => { const on = el.dataset.theme === t.id;
                    el.classList.toggle("active", on);
                    el.setAttribute("aria-checked", on ? "true" : "false"); });
                try { localStorage.setItem(KEY, t.id); } catch (e) {}
            }
            let saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) {}
            if (!THEMES.some(t => t.id === saved)) saved = "light";
            apply(saved, false);

            function setOpen(on) { wrap.classList.toggle("open", on);
                btn.setAttribute("aria-expanded", on ? "true" : "false"); }
            btn.addEventListener("click", e => { e.stopPropagation();
                setOpen(!wrap.classList.contains("open")); });
            document.addEventListener("click", () => setOpen(false));
            panel.addEventListener("click", e => e.stopPropagation());
            document.addEventListener("keydown", e => { if (e.key === "Escape") setOpen(false); });
        })();
