<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>矩阵方块官网</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #374151;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .nav {
            text-align: center;
            padding: 2rem 0 3rem;
        }
        .nav h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #000, #333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }
        .product {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .product:hover {
            transform: translateY(-5px);
        }
        .product-image {
            height: 200px;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 1.5rem;
            object-fit: cover;
        }
        .icon-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 1.5rem;
            background: linear-gradient(135deg, #9ca3af, #6b7280);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
        }
        .version-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }
        .official { background: #ef4444; }
        .unreleased { background: #9ca3af; }
        .product-info { padding: 1.5rem; }
        .product-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .product-desc { color: #6b7280; font-size: 0.9rem; margin-bottom: 1rem; }
        .download-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: #f3f4f6;
            border-radius: 0.75rem;
            text-decoration: none;
            color: #374151;
            margin-top: 1rem;
        }
        .disabled {
            opacity: 0.6;
            pointer-events: none;
        }
        .footer {
            text-align: center;
            padding: 2rem;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
            margin-top: 2rem;
        }
        .reward-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f43f5e;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            z-index: 100;
        }
        .reward-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .reward-modal.show { display: flex; }
        .reward-modal-content {
            background: #fff;
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .qr-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }
        .qr-item img {
            width: 140px;
            height: 140px;
            border-radius: 1rem;
        }
        .back-to-top {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .back-to-top.show { opacity: 1; visibility: visible; }
        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .qr-item img { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav">
        <h1>矩阵方块</h1>
        <p>解锁创意方块 · 掌握美好艺术</p>
    </div>

    <div class="products" id="productsContainer">加载中...</div>

    <div class="footer">
        <p>© 2026 矩阵方块</p>
    </div>
</div>

<button id="rewardBtn" class="reward-btn"><i class="fas fa-heart"></i> 赞赏支持</button>
<div id="rewardModal" class="reward-modal">
    <div class="reward-modal-content">
        <span style="float:right;cursor:pointer" id="closeModal">&times;</span>
        <h3>支持矩阵方块</h3>
        <div class="qr-container">
            <div class="qr-item"><img src="./wechat_qr.png" alt="微信"><div>微信赞赏</div></div>
            <div class="qr-item"><img src="./alipay_qr.png" alt="支付宝"><div>支付宝赞赏</div></div>
        </div>
    </div>
</div>

<div id="backToTop" class="back-to-top">↑</div>

<script>
    // 加载 data.json
    async function loadProducts() {
        try {
            const response = await fetch('./data.json');
            const data = await response.json();
            renderProducts(data.products);
        } catch (error) {
            console.error('加载失败:', error);
            document.getElementById('productsContainer').innerHTML = '<p style="text-align:center;color:#ef4444;">加载失败，请刷新重试</p>';
        }
    }

    function renderProducts(products) {
        const container = document.getElementById('productsContainer');
        if (!products || products.length === 0) {
            container.innerHTML = '<p style="text-align:center;">暂无产品</p>';
            return;
        }
        container.innerHTML = products.map(p => {
            const isUnreleased = p.status === 'unreleased';
            const badgeClass = isUnreleased ? 'unreleased' : 'official';
            const badgeText = isUnreleased ? '未发布' : '正式版';
            const downloadDisabled = !p.downloadUrl || isUnreleased;
            const downloadHtml = downloadDisabled ?
                `<div class="download-link disabled"><span>Android</span><span>敬请期待</span></div>` :
                `<a href="${p.downloadUrl}" class="download-link"><span>Android</span><span>${p.version} →</span></a>`;
            const imgHtml = p.imageUrl ?
                `<img src="${p.imageUrl}" class="app-icon" onerror="this.src='https://placehold.co/80x80?text=?'">` :
                `<div class="icon-placeholder">?</div>`;
            return `
                <div class="product">
                    <div class="product-image">
                        ${imgHtml}
                        <span class="version-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${escapeHtml(p.name)}</div>
                        <div class="product-desc">${escapeHtml(p.desc || '')}</div>
                        ${downloadHtml}
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // UI 交互
    document.getElementById('rewardBtn').onclick = () => document.getElementById('rewardModal').classList.add('show');
    document.getElementById('closeModal').onclick = () => document.getElementById('rewardModal').classList.remove('show');
    const backBtn = document.getElementById('backToTop');
    window.onscroll = () => {
        if (window.scrollY > 300) backBtn.classList.add('show');
        else backBtn.classList.remove('show');
    };
    backBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    // 初始化
    loadProducts();
</script>
</body>
</html>
