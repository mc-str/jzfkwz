ul></div>`});hL.innerHTML=hH;if(sLS){hL.classList.add('show');tB.innerHTML='<i class="fas fa-chevron-up"></i> 收起往期更新'}}}tB.onclick=()=>{const isS=hL.classList.toggle('show');tB.innerHTML=isS?'<i class="fas fa-chevron-up"></i> 收起往期更新':'<i class="fas fa-chevron-down"></i> 查看往期更新';localStorage.setItem('lHS',isS?'show':'hide')};function oM(){m.classList.add('show');rD.classList.remove('show');localStorage.setItem('uLV',window.logData?.latestVersion);document.body.style.overflow='hidden';uT.classList.remove('show')}lB.onclick=oM;uTbd.onclick=()=>{uT.classList.remove('show');oM()};uTbl.onclick=()=>uT.classList.remove('show');uTclose.onclick=()=>uT.classList.remove('show');function cM(){m.classList.remove('show');document.body.style.overflow='auto'}cB.onclick=cM;m.onclick=(e)=>e.target===m&&cM();document.onkeydown=(e)=>{if(e.key==='Escape'){document.querySelectorAll('.modal.show').forEach(ms=>ms.classList.remove('show'));uT.classList.remove('show');document.body.style.overflow='auto'}};window.addEventListener('load',rL)})();setInterval(uRT,1000);setInterval(uC,1000);uRT();uC();lD();</script></body></html>
